name: Panther X2 sync check

on:
  workflow_dispatch:
  push:
    branches:
      - panther-x2
  schedule:
    - cron: '17 3 * * 1'

jobs:
  sync-and-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget curl

      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Prepare default configuration
        run: make defconfig

      - name: Prepare Linux source
        run: make target/linux/prepare V=s

      - name: Sync Panther X2 DTS from ophub
        env:
          OPHUB_REF: main
        run: sh ./target/panther-x2/scripts/sync-ophub.sh

      - name: Compile Linux kernel
        run: make target/linux/compile V=s
