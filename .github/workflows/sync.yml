name: Sync VIKINGYFY owrt

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync VIKINGYFY owrt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/VIKINGYFY/immortalwrt.git
          git fetch upstream owrt

          # The upstream owrt branch is authoritative for source-tree files.
          # Keep repository-specific CI/config files by resolving conflicts in favor of HEAD.
          git restore --source=upstream/owrt -- README.md
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m "chore: sync root README from upstream/owrt"
          fi

          if git merge-base --is-ancestor upstream/owrt HEAD; then
            echo "Already up to date with upstream/owrt."
          else
            git merge --no-edit --strategy=ort -X theirs upstream/owrt || {
              echo "Merge failed. Resolving remaining conflicts by keeping upstream/owrt..."
              git checkout --theirs -- .
              git add -A
              git commit --no-edit -m "chore: sync VIKINGYFY owrt"
            }
          fi

          git push origin HEAD:main
