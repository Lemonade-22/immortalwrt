name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    # 04:00 Singapore time (UTC+8) every day.
    - cron: '0 20 * * *'

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Sync VIKINGYFY owrt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/VIKINGYFY/immortalwrt.git
          git fetch upstream owrt

          # The owrt branch is the upstream multi-platform branch.
          # Root README is upstream-owned: always mirror upstream/owrt.
          git restore --source=upstream/owrt -- README.md
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m "chore: sync root README from upstream/owrt"
          fi

          if git merge-base --is-ancestor upstream/owrt HEAD; then
            echo "Already up to date with upstream/owrt."
          else
            git merge --no-edit upstream/owrt
          fi

          git push origin HEAD:main
